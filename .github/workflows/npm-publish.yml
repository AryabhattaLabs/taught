# Publish each release's taught.tgz to npm as `taught`, so `npm i -g taught` installs it.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored here. On npmjs.com the package's
# trusted publisher is AryabhattaLabs / taught / npm-publish.yml; the package's `repository` field must point
# at this repo.
#
# The package is built elsewhere and attached to the release, so provenance is turned off: an attestation from
# this repo would name a commit that does not contain the code it describes.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0-beta.21"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest && npm --version

      - name: Download taught.tgz from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern taught.tgz

      - name: Check the package before publishing
        id: check
        run: |
          name=$(tar -xzOf taught.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          version=$(tar -xzOf taught.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          echo "taught.tgz is $name@$version; the release is $TAG"
          if [ "$name" != "taught" ] || [ "v$version" != "$TAG" ]; then
            echo "::error::taught.tgz ($name@$version) does not match the release tag ($TAG)"
            exit 1
          fi
          if npm view "taught@$version" version >/dev/null 2>&1; then
            echo "taught@$version is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Every release so far is a beta and is what `npm i -g taught` should install, so it goes to `latest`.
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish ./taught.tgz --tag latest --provenance=false
