<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 471" width="880" height="471" role="img" aria-label="On laptop 1 an agent records a rule with taught note. A few minutes later, on laptop 2, taught sync has written the rule into AGENTS.md and CLAUDE.local.md, and git status shows nothing.">
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px}
.win{fill:#161b22;stroke:#30363d}.rule{stroke:#30363d;fill:none}
.title{fill:#8b949e;font-size:12.5px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.l{fill:#c9d1d9;opacity:0;animation:in .25s ease-out forwards}
.com{fill:#8b949e}.out{fill:#c9d1d9}.pr{fill:#7ee787}.cmd{fill:#e6edf3;font-weight:600}
@keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
</style>
<rect x="1" y="1" width="878" height="154" rx="9" class="win"/>
<path d="M1 35h878" class="rule"/>
<circle cx="20" cy="18.0" r="5.5" fill="#ff5f57"/>
<circle cx="38" cy="18.0" r="5.5" fill="#febc2e"/>
<circle cx="56" cy="18.0" r="5.5" fill="#28c840"/>
<text x="440.0" y="22.5" text-anchor="middle" class="title">Laptop 1  ·  ~/code/todo-app</text>
<text x="22" y="61" class="l com" style="animation-delay:0.40s"># You correct Claude Code. It records the rule itself:</text>
<text x="22" y="82" class="l " style="animation-delay:1.10s"><tspan class="pr">$ </tspan><tspan class="cmd">taught note &quot;All dates are stored in UTC&quot; \</tspan></text>
<text x="22" y="103" class="l " style="animation-delay:1.35s"><tspan class="cmd" dx="48.6">--why &quot;A report was a day off for users east of UTC&quot;</tspan></text>
<text x="22" y="124" class="l out" style="animation-delay:1.80s">Noted (todo-app). ~/.taught/projects/todo-app/_project/entries/01M7…-all-dates-are-stored-in-utc.md</text>
<rect x="1" y="169" width="878" height="301" rx="9" class="win"/>
<path d="M1 203h878" class="rule"/>
<circle cx="20" cy="186.0" r="5.5" fill="#ff5f57"/>
<circle cx="38" cy="186.0" r="5.5" fill="#febc2e"/>
<circle cx="56" cy="186.0" r="5.5" fill="#28c840"/>
<text x="440.0" y="190.5" text-anchor="middle" class="title">Laptop 2  ·  ~/code/todo-app  ·  a few minutes later</text>
<text x="22" y="229" class="l com" style="animation-delay:3.30s"># The background sync brings it. Or run one yourself:</text>
<text x="22" y="250" class="l " style="animation-delay:4.00s"><tspan class="pr">$ </tspan><tspan class="cmd">taught sync</tspan></text>
<text x="22" y="271" class="l out" style="animation-delay:4.45s">local-first ~/.taught: pulled / pushed / 0 file(s) committed</text>
<text x="22" y="292" class="l out" style="animation-delay:4.90s">updated todo-app: agent files in 1 checkout (1 repo)</text>
<text x="22" y="313" class="l com" style="animation-delay:5.05s">(details: taught sync --verbose)</text>
<text x="22" y="334" class="l com" style="animation-delay:5.95s"># Codex reads AGENTS.md, Claude Code reads CLAUDE.local.md. Both have the rule:</text>
<text x="22" y="355" class="l " style="animation-delay:6.65s"><tspan class="pr">$ </tspan><tspan class="cmd">grep -l &quot;stored in UTC&quot; AGENTS.md CLAUDE.local.md</tspan></text>
<text x="22" y="376" class="l out" style="animation-delay:7.10s">AGENTS.md</text>
<text x="22" y="397" class="l out" style="animation-delay:7.55s">CLAUDE.local.md</text>
<text x="22" y="418" class="l " style="animation-delay:8.25s"><tspan class="pr">$ </tspan><tspan class="cmd">git status --short</tspan></text>
<text x="22" y="439" class="l com" style="animation-delay:9.15s"># nothing to show: the files Taught wrote are git-ignored</text>
</svg>
